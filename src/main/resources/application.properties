spring.application.name=notification-service
server.port=8081

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.listener.concurrency=3
app.kafka.notification-topic=notifications

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hh.oneplusplus.*
spring.kafka.consumer.properties.spring.json.use.type.headers=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:notification_db}
spring.datasource.username=${POSTGRES_USER:notification_user}
spring.datasource.password=${POSTGRES_PASSWORD:notification_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.cache.template.max-size=50
app.cache.template.expire-hours=2

app.sse.max-tabs-per-user=5
app.sse.heartbeat-delay-ms=20000
app.sse.reconnect-time-ms=10000

spring.mail.host=smtp.yandex.ru
spring.mail.port=465
spring.mail.username=${MAIL_SENDER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465

jwt.access.expire=${ACCESS_EXPIRE:30}
jwt.refresh.expire=${REFRESH_EXPIRE:30}
jwt.access.secret-code=${ACCESS_SECRET_CODE:VYQQcgkftlCfu4HDrgIKdnBFZWnUs5HyYumkEWecyDH}
jwt.refresh.secret-code=${REFRESH_SECRET_CODE:pHxVb5s6jTJOGyMoJ72wCpaDrXAoc1Inxl2C0WzLUsS}

frontend.SPA=${FRONTEND_SPA:http://localhost:3000}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
